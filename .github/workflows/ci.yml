name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Test (pytest)
        run: pytest -q --cov=src --cov-report=term-missing

      - name: End-to-end smoke (offline mode, no API key)
        run: |
          python scripts/generate_data.py
          python -m src.cli data/clean_experiment.csv --mode offline
          python -m src.cli data/compromised_experiment.csv --mode offline
          python -m src.cli data/messy_experiment.csv --mode offline
