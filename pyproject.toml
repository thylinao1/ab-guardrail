[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-guardrail"
version = "0.3.0"
description = "Command-line A/B testing and causal-inference guardrail for online experiments."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Maksim Silchenko" }]
requires-python = ">=3.10"
keywords = ["ab-testing", "causal-inference", "propensity-score-matching", "srm", "experimentation", "llm-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "anthropic>=0.40,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
ab-guardrail = "src.cli:main"

[project.urls]
Homepage = "https://github.com/thylinao1/ab-guardrail"
Issues = "https://github.com/thylinao1/ab-guardrail/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # handled by formatter
